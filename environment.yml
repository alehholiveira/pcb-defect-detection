name: pcb-defect

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - jupyter
  - jupyterlab
  - openssl
  - certifi=2026.4.22
  - pillow
  - numpy
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1
  - pip
  - pip:
      - pandas==3.0.3
      - matplotlib==3.10.9
      - seaborn==0.13.2
      - tqdm==4.67.3
      - PyYAML==6.0.3
      - torchmetrics==1.9.0
      - ultralytics==8.4.48
      - pycocotools==2.0.11